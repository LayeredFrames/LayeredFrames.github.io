<!DOCTYPE html>
<html lang="{{ site.locale | slice: 0,2 | default: "en" }}" data-theme="dark">

  {% include head.html %}

  <body id="page-top">
	  <script src="/assets/js/jquery.min.js"></script>

      {{ content }}

	  {% include footer.html %}

	  <!-- Bootstrap core JavaScript -->
	  <script src="/assets/js/bootstrap.bundle.min.js"></script>

	  <!-- Plugin JavaScript -->
	  <script src="/assets/js/jquery.easing.min.js"></script>

	  <!-- Contact form JavaScript -->
	  <script src="/assets/js/jqBootstrapValidation.js"></script>
	  <script src="/assets/js/contact_me.js"></script>

	  <!-- Custom scripts for this template -->
	  <script src="/assets/js/agency.min.js"></script>

	  <script>
		// Ensure this runs after the DOM is fully loaded
		document.addEventListener("DOMContentLoaded", function () {
			// Listen for the modal close event
			$(".modal").on("hide.bs.modal", function (e) {
			if (document.activeElement) {
				document.activeElement.blur();
			};
			// Reset the src attribute of any iframe inside the modal
			$(this).find("iframe").each(function () {
				$(this).attr("src", $(this).attr("src"));
			});
			// set aria-hidden attribute to true
			$(this).attr("aria-hidden", "true");
			});

			// Add event listner for the modal open event
			$(".portfolio-modal").on("show.bs.modal", function (e) {
				// set aria-hidden attribute to false
				$(this).attr("aria-hidden", "false");
			});
		});
	</script>

	  <!-- Custom scripts -->
	  {%- comment -%} <script src="/assets/js/video_comparison.js"></script> {%- endcomment -%}
	  {% if jekyll.environment == "development" %}
	  <script src="/assets/js/editfile.js"></script>
	  {% endif %}

  </body>
</html>
