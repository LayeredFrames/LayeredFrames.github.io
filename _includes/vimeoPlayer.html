<div class="embed-container">
  <iframe
        title="vimeo-player"
        class="d-block mx-auto"
        src="https://player.vimeo.com/video/{{ include.id }}"
        width="{{ include.width | default: 960 }}"
        height="{{ include.height | default: 540 }}"
        frameborder="0"
        allowfullscreen="true"
        loading="lazy">
    </iframe>
</div>
